# Models Configuration

# 9 Baseline Algorithms (Li & Wu 2024 Replication)
baselines:
  logistic_regression:
    penalty: "l2"
    C: 1.0
    solver: "lbfgs"
    max_iter: 1000
    random_state: 42

  decision_tree:
    criterion: "gini"
    max_depth: 10
    min_samples_split: 50
    min_samples_leaf: 20
    random_state: 42

  random_forest:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 20
    min_samples_leaf: 10
    n_jobs: -1
    random_state: 42

  adaboost:
    n_estimators: 100
    learning_rate: 0.1
    random_state: 42

  gbdt:
    n_estimators: 150
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    random_state: 42

  xgboost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "logloss"
    random_state: 42

  lightgbm:
    n_estimators: 250
    learning_rate: 0.03
    num_leaves: 31
    max_depth: -1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    verbose: -1

  catboost:
    iterations: 300
    learning_rate: 0.05
    depth: 6
    random_seed: 42
    verbose: 0

  mlp:
    hidden_layer_sizes: [64, 32]
    activation: "relu"
    solver: "adam"
    alpha: 0.0001
    batch_size: 256
    learning_rate_init: 0.001
    max_iter: 200
    random_state: 42

# Champion Boosters for Factorial Ablation Matrix
champion_boosters:
  - "lightgbm"
  - "catboost"
  - "xgboost"
  - "random_forest"
